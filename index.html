<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>新規武具 250件 レビューサイト（画像・フレーバーテキスト）</title>
<style>
:root{color-scheme:dark;--bg:#141817;--card:#1c2220;--line:#323b38;--paper:#ece6d8;--muted:#9fa7a3;--accent:#d9c28c;--ok:#5fb37b;--hold:#d8a94c;--ng:#d46868}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--paper);font:14px/1.65 system-ui,-apple-system,sans-serif}
header{position:sticky;top:0;z-index:20;background:rgba(20,24,23,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 20px}
.head-top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;max-width:1600px;margin:0 auto 10px}
h1{margin:0;font:600 20px/1.3 serif;color:var(--accent)}
.stats{font-size:12px;color:var(--muted)}
.controls{display:flex;flex-wrap:wrap;gap:8px;max-width:1600px;margin:0 auto;align-items:center}
select,input,button,textarea{font:inherit;color:var(--paper);background:#252d2a;border:1px solid var(--line);border-radius:6px;padding:6px 10px}
input[type=search]{min-width:220px;flex:1 1 220px}
button{cursor:pointer}
button:hover,select:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:#171c1a;border-color:var(--accent);font-weight:600}
main{max-width:1600px;margin:0 auto;padding:18px 20px 60px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:16px}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.card.d-accepted{border-color:var(--ok)}
.card.d-hold{border-color:var(--hold)}
.card.d-rejected{border-color:var(--ng)}
.card-head{padding:12px 14px 8px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card-head h2{margin:0;font:600 17px/1.3 serif}
.card-head code{font-size:11px;color:var(--muted)}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.badge{font-size:11px;padding:2px 7px;border-radius:99px;background:#27302d;border:1px solid #3a4541;color:#d2d8d4}
.badge.band{color:var(--accent);border-color:#5b5038}
.stage{position:relative;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;cursor:zoom-in;overflow:hidden}
.bg-dark{background:#1d1915}
.bg-parchment{background:#dfd5be}
.bg-white{background:#ffffff}
.bg-checker{background:repeating-conic-gradient(#2c3130 0% 25%,#1e2221 0% 50%) 50%/20px 20px}
.stage img{width:100%;height:100%;object-fit:contain;display:block}
.stage .pending{color:var(--muted);font-size:13px}
.body{padding:12px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.summary{font-weight:600;color:#f3ebd8;font-size:13.5px}
.lore{white-space:pre-wrap;background:#151a19;border:1px solid #2b3330;border-radius:6px;padding:10px 12px;font-size:13px;line-height:1.75;color:#e5dfd2}
.meta{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.meta b{color:#cfc8b8;font-weight:600}
.review{border-top:1px solid var(--line);padding:10px 14px 12px;background:#181e1c;display:flex;flex-direction:column;gap:8px}
.review-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.review label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--muted)}
.review textarea{width:100%;resize:vertical;min-height:54px;font-size:12.5px}
.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
.modal[hidden]{display:none}
.modal img{max-width:min(92vw,900px);max-height:92vh;object-fit:contain;border-radius:8px}
</style>
</head>
<body>
<header>
  <div class="head-top">
    <div>
      <h1>新規武具 250件 レビュー（画像・フレーバーテキスト）</h1>
      <div class="stats" id="stats">読み込み中…</div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button id="exportBtn" class="primary" type="button">レビュー結果JSONを保存 ↓</button>
      <button id="copyBtn" type="button">JSONをコピー</button>
      <label style="display:inline-flex;align-items:center;gap:4px;cursor:pointer;background:#252d2a;border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px">
        JSON読込 <input id="importInput" type="file" accept="application/json" style="display:none">
      </label>
    </div>
  </div>
  <div class="controls">
    <input id="q" type="search" placeholder="武具名・ID・フレーバー・効果で検索…">
    <select id="fType"><option value="">全種別 (35)</option></select>
    <select id="fBand">
      <option value="">全出現帯</option>
      <option value="intro">intro</option><option value="low">low</option><option value="middle">middle</option>
      <option value="high">high</option><option value="deep">deep</option><option value="abyss">abyss</option><option value="endless">endless</option>
    </select>
    <select id="fBatch"><option value="">全バッチ</option></select>
    <select id="fStatus">
      <option value="">全判定</option>
      <option value="revised">今回の修正分</option>
      <option value="unreviewed">未確認あり</option>
      <option value="accepted">両方採用</option>
      <option value="hold">保留あり</option>
      <option value="rejected">不採用あり</option>
      <option value="commented">コメントあり</option>
    </select>
    <select id="bgMode" title="透過確認用の背景色">
      <option value="bg-dark">背景: 暗羊皮紙</option>
      <option value="bg-parchment">背景: 明羊皮紙</option>
      <option value="bg-checker">背景: 市松透過</option>
      <option value="bg-white">背景: 純白</option>
    </select>
  </div>
</header>
<main>
  <div class="grid" id="grid"></div>
</main>
<div class="modal" id="modal" hidden><img id="modalImg" alt=""></div>
<script src="app.js"></script>
</body>
</html>
